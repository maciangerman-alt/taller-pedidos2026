<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta del día — Taller Artesanal</title>
<style>
:root{--paper:#E9EBE2;--paper2:#DFE2D6;--ink:#16211E;--soft:#5A665F;--line:#C3C9BB;
  --signal:#F2B01E;--alert:#A33A24;--v1:#2C6E5B;--v2:#A33A24;--v3:#33547E}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.45;
  font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:860px;margin:0 auto;padding:24px 16px 80px}
header.top{border-bottom:3px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
h1{font-size:clamp(28px,7.5vw,44px);font-weight:900;letter-spacing:-.03em;margin:0;line-height:.95}
header.top p{margin:6px 0 0;font-size:13px;color:var(--soft);max-width:54ch}
fieldset{border:1px solid var(--line);border-radius:10px;background:var(--paper2);padding:15px;margin:0 0 14px}
legend{font-weight:700;font-size:14px;padding:0 8px}
label{display:block;font-size:12.5px;font-weight:500;color:var(--soft);margin-bottom:4px}
input,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-radius:7px;padding:9px 10px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--signal);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.field{margin-bottom:11px}
button{font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--ink);
  border-radius:8px;padding:11px 17px;background:var(--signal);color:var(--ink)}
button.ghost{background:transparent}
button.small{font-size:13px;padding:6px 10px}
button:disabled{opacity:.5;cursor:progress}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);
  border-bottom:2px solid var(--ink);padding:5px 6px}
td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.borrar{background:none;border:none;color:var(--alert);font-weight:900;cursor:pointer;font-size:17px;padding:0 4px}
#estado{font-size:14px;font-weight:600;margin:12px 0 0;min-height:20px}
#estado.err{color:var(--alert)}
.aviso{border:2px solid var(--alert);border-radius:9px;background:var(--paper2);padding:11px;
  font-size:13.5px;margin:12px 0 0;display:none}
.resumen{display:flex;flex-wrap:wrap;gap:20px;border-top:3px solid var(--ink);border-bottom:1px solid var(--line);
  padding:13px 0;margin:26px 0 0}
.resumen span{display:block;font-size:11.5px;color:var(--soft);font-weight:500}
.resumen strong{font-size:25px;font-weight:900;letter-spacing:-.02em}
.autos{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.autos button{border-radius:20px;background:transparent;font-size:13.5px;padding:7px 14px}
.autos button.on{background:var(--ink);color:var(--paper)}
ol.ruta{list-style:none;margin:16px 0 0;padding:0 0 0 42px;position:relative}
ol.ruta:before{content:"";position:absolute;left:14px;top:12px;bottom:22px;width:3px;background:var(--vcol)}
ol.ruta li{position:relative;padding:14px 0;border-bottom:1px solid var(--line)}
ol.ruta li:last-child{border-bottom:0}
.marca{position:absolute;left:-42px;top:12px;width:31px;height:31px;border-radius:50%;background:var(--vcol);
  color:var(--paper);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--paper)}
.fila{display:flex;gap:13px}
.hora{font-size:21px;font-weight:900;letter-spacing:-.02em;line-height:1.1;min-width:62px}
.cliente{font-weight:700;font-size:16px}
.dir{font-size:13.5px;color:var(--soft)}
.meta{font-size:12px;color:var(--soft);margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--ink);border-radius:20px;
  padding:1px 8px;margin:2px 5px 0 0;background:var(--paper2)}
.tag.fija{background:var(--signal)}
.tag.mal{background:var(--alert);color:var(--paper);border-color:var(--alert)}
.tag.espera{background:transparent;border-style:dashed}
.afuera{border:2px solid var(--alert);border-radius:10px;padding:13px;margin-top:20px;background:var(--paper2)}
.afuera h3{margin:0 0 6px;font-size:15px;color:var(--alert)}
.mapa{margin:22px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--paper2);padding:8px}
svg{display:block;width:100%;height:auto}
.hint{font-size:12px;color:var(--soft);margin:6px 0 0}
.buscador{position:relative}
.sugerencias{position:absolute;z-index:40;left:0;right:0;top:100%;margin-top:3px;background:var(--paper);
  border:1px solid var(--ink);border-radius:9px;box-shadow:0 6px 18px rgba(22,33,30,.16);
  max-height:290px;overflow:auto;display:none}
.sugerencias.on{display:block}
.sug{padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--line)}
.sug:last-child{border-bottom:0}
.sug:hover,.sug.sel{background:var(--signal)}
.sug b{display:block;font-size:14px;font-weight:700;line-height:1.25}
.sug span{font-size:12.5px;color:var(--soft)}
.sug.nada{cursor:default;color:var(--soft);font-size:13px}
.sug.nada:hover{background:var(--paper)}
.estadoBase{font-size:12px;color:var(--soft);margin:8px 0 0}
.verif{border:1px solid var(--line);border-radius:10px;background:var(--paper2);padding:11px 13px;margin-top:22px}
.verif summary{font-weight:700;font-size:14px;cursor:pointer}
.verif ul{list-style:none;margin:10px 0 0;padding:0}
.verif li{font-size:13px;color:var(--soft);padding:9px 0;border-bottom:1px solid var(--line)}
.verif li:last-child{border-bottom:0}
.verif li b{color:var(--ink);font-size:14px}
.verif li.mal{border-left:3px solid var(--alert);padding-left:9px}
.verif .rojo{color:var(--alert);font-weight:600}
.verif a{color:var(--ink)}
a.tramo{display:inline-block;margin:0 7px 7px 0;font-weight:700;font-size:13.5px;text-decoration:none;
  color:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:9px 13px;background:var(--paper2)}
@media(max-width:520px){.hora{font-size:19px;min-width:54px}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>Ruta del día</h1>
  <p>Cargás a dónde vas. Sale la ruta que respeta los horarios y hace menos kilómetros.</p>
</header>

<fieldset>
  <legend>Mis puntos fijos</legend>
  <div class="field">
    <label for="taller">Dirección del taller</label>
    <input id="taller" placeholder="Calle y altura, San Miguel de Tucumán">
  </div>
  <div class="field">
    <label for="casa">Dirección de mi domicilio</label>
    <input id="casa" placeholder="Calle y altura">
  </div>
  <div class="grid">
    <div><label for="origen">Salgo desde</label><select id="origen"><option value="taller">El taller</option><option value="casa">Mi domicilio</option></select></div>
    <div><label for="fin">Termino en</label><select id="fin"><option value="taller">El taller</option><option value="casa">Mi domicilio</option><option value="libre">La última entrega</option></select></div>
    <div><label for="salida">Salgo a las</label><input id="salida" type="time" value="08:00"></div>
    <div><label for="autos">Autos</label><select id="autos"><option>1</option><option>2</option><option selected>3</option></select></div>
    <div><label for="servicio">Minutos en cada entrega</label><input id="servicio" type="number" value="10" min="1" max="90"></div>
  </div>
</fieldset>

<fieldset>
  <legend>A dónde voy hoy</legend>
  <div class="grid">
    <div class="buscador">
      <label for="nom">Quién — escribí y buscá en la base</label>
      <input id="nom" autocomplete="off" placeholder="Escribí el nombre, la calle o la localidad">
      <div id="sug" class="sugerencias"></div>
    </div>
    <div><label for="dir">Dirección</label><input id="dir" placeholder="Se completa sola, o la escribís vos"></div>
  </div>
  <p class="estadoBase" id="estadoBase">Cargando la base de escuelas…</p>
  <div class="grid" style="margin-top:11px">
    <div><label for="desde">Atiende desde (opcional)</label><input id="desde" type="time"></div>
    <div><label for="hasta">Atiende hasta (opcional)</label><input id="hasta" type="time"></div>
  </div>
  <div class="actions">
    <button id="agregar" class="small">Agregar</button>
    <button id="demo" class="ghost small">Probar con un día de ejemplo</button>
    <button id="limpiar" class="ghost small">Vaciar</button>
  </div>
  <div id="tabla"></div>
</fieldset>

<button id="armar">Armar la ruta</button>
<p id="estado"></p>
<div id="aviso" class="aviso"></div>
<div id="out"></div>

</div>
<script>
const $ = id => document.getElementById(id);
const COLORES = ['var(--v1)','var(--v2)','var(--v3)'];
let paradas = [], rutas = [], activo = 0, cacheGeo = {}, degradado = false;

const hhmm = m => (m=Math.round(m), String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));
const aMin = s => { if(!s) return null; const [h,m]=s.split(':').map(Number); return h*60+m; };
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dormir = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- tránsito: automático, sin perillas ---------- */
const PICOS = [7.5,9,12,13,14,18,21].map(h=>h*60);
function penal(min){                       // multiplicador sobre el tiempo de viaje
  let p = 1;
  for(const q of PICOS){
    const d = Math.abs(min-q);
    if(d < 30) p = Math.max(p, 1 + 0.75*(1 - d/30));
  }
  return p;
}
const enPico = m => penal(m) > 1.15;

/* ---------- geocoding (Nominatim) ---------- */
async function geo(dirCruda){
  const d = /tucum/i.test(dirCruda) ? dirCruda : dirCruda + ', Tucumán, Argentina';
  if(cacheGeo[d]) return cacheGeo[d];
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=' + encodeURIComponent(d);
  const r = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('geo');
  const j = await r.json();
  if(!j.length) return null;
  const p = { lat:+j[0].lat, lng:+j[0].lon, resuelta:j[0].display_name };
  cacheGeo[d] = p;
  await dormir(1100);                       // política de uso de Nominatim
  return p;
}

/* ---------- matriz de tiempos reales (OSRM) ---------- */
let M = null;                               // M.dur[i][j] minutos, M.dist[i][j] km
async function matriz(pts){
  const coords = pts.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');
  const url = `https://router.project-osrm.org/table/v1/driving/${coords}?annotations=duration,distance`;
  const r = await fetch(url);
  if(!r.ok) throw new Error('osrm');
  const j = await r.json();
  if(j.code !== 'Ok') throw new Error('osrm');
  return { dur: j.durations.map(f=>f.map(v=>(v??0)/60)), dist: j.distances.map(f=>f.map(v=>(v??0)/1000)) };
}
function matrizRecta(pts){                  // plan B si no hay red
  const RAD=Math.PI/180, K=(a,b)=>{
    const dLa=(b.lat-a.lat)*RAD,dLn=(b.lng-a.lng)*RAD;
    const h=Math.sin(dLa/2)**2+Math.cos(a.lat*RAD)*Math.cos(b.lat*RAD)*Math.sin(dLn/2)**2;
    return 2*6371*Math.asin(Math.sqrt(h))*1.32;
  };
  const n=pts.length, dist=[], dur=[];
  for(let i=0;i<n;i++){ dist.push([]); dur.push([]);
    for(let j=0;j<n;j++){ const d=K(pts[i],pts[j]); dist[i].push(d); dur[i].push(d/26*60); } }
  return {dur,dist};
}

/* ---------- evaluación de una secuencia (índices en M) ---------- */
function evaluar(sec, iOrigen, iFin){
  const t0 = aMin($('salida').value), serv = +$('servicio').value||10;
  let t=t0, kms=0, prev=iOrigen, det=[], tarde=0;
  for(const p of sec){
    const dur = M.dur[prev][p.i] * penal(t);
    let lleg = t + dur, espera = 0;
    if(p.desde!=null && lleg<p.desde){ espera=p.desde-lleg; lleg=p.desde; }
    const mal = (p.hasta!=null && lleg>p.hasta);
    if(mal) tarde++;
    det.push({p,lleg,espera,km:M.dist[prev][p.i],mal,pico:enPico(t)});
    kms += M.dist[prev][p.i]; t = lleg+serv; prev = p.i;
  }
  let regreso=null;
  if(iFin!=null){ const d=M.dur[prev][iFin]*penal(t); kms+=M.dist[prev][iFin]; t+=d; regreso=t; }
  return {det,km:kms,fin:t,regreso,tarde};
}
/* prioridad de Germán: 1) horarios  2) kilómetros  3) terminar temprano */
const costo = e => e.tarde*1e7 + e.km*1000 + e.fin;

function construir(items, iOrigen, iFin){
  const orden = items.slice().sort((a,b)=>(a.hasta??1e9)-(b.hasta??1e9));
  let sec=[];
  for(const it of orden){
    let mejor=null;
    for(let i=0;i<=sec.length;i++){
      const c = sec.slice(0,i).concat([it], sec.slice(i));
      const v = costo(evaluar(c,iOrigen,iFin));
      if(!mejor || v<mejor.v) mejor={v,c};
    }
    sec = mejor.c;
  }
  let sigue=true,g=0;
  while(sigue && g++<40){
    sigue=false;
    const base = costo(evaluar(sec,iOrigen,iFin));
    for(let i=0;i<sec.length-1;i++) for(let j=i+1;j<sec.length;j++){
      const c = sec.slice(0,i).concat(sec.slice(i,j+1).reverse(), sec.slice(j+1));
      if(costo(evaluar(c,iOrigen,iFin)) < base-0.01){ sec=c; sigue=true; }
    }
  }
  return sec;
}

function repartir(iOrigen, iFin, base){
  const n = +$('autos').value;
  const ang = p => Math.atan2(p.lat-base.lat, p.lng-base.lng);
  const orden = paradas.slice().sort((a,b)=>ang(a)-ang(b));
  let grupos = Array.from({length:n},()=>[]);
  orden.forEach((p,k)=>grupos[Math.floor(k*n/orden.length)].push(p));
  let secs = grupos.map(g=>construir(g,iOrigen,iFin));
  const total = ss => ss.reduce((a,s)=>a+costo(evaluar(s,iOrigen,iFin)),0);
  for(let pase=0;pase<3;pase++){
    for(let a=0;a<n;a++) for(let b=0;b<n;b++){
      if(a===b) continue;
      for(const p of secs[a].slice()){
        const nA = secs[a].filter(x=>x!==p);
        const cand = secs.slice();
        cand[a]=construir(nA,iOrigen,iFin);
        cand[b]=construir(secs[b].concat([p]),iOrigen,iFin);
        if(total(cand) < total(secs)-1) secs = cand;
      }
    }
  }
  return secs;
}

/* ---------- tabla de carga ---------- */
function tabla(){
  if(!paradas.length){ $('tabla').innerHTML='<p class="hint">Todavía no cargaste ninguna parada.</p>'; return; }
  $('tabla').innerHTML = `<table><thead><tr><th>Quién</th><th>Dirección</th><th>Horario</th><th></th></tr></thead><tbody>`
   + paradas.map((p,i)=>`<tr>
      <td><strong>${esc(p.nombre)}</strong></td>
      <td>${esc(p.dir)}</td>
      <td>${p.desde!=null||p.hasta!=null?`${p.desde!=null?hhmm(p.desde):'—'} a ${p.hasta!=null?hhmm(p.hasta):'—'}`:'libre'}</td>
      <td><button class="borrar" onclick="quitar(${i})" aria-label="Quitar">×</button></td></tr>`).join('')
   + '</tbody></table>';
}
function quitar(i){ paradas.splice(i,1); tabla(); }

/* ---------- render ---------- */
function mapa(base, finPt){
  const todos = rutas.flat().concat([base]).concat(finPt?[finPt]:[]);
  const la=todos.map(p=>p.lat), ln=todos.map(p=>p.lng);
  const mnLa=Math.min(...la),mxLa=Math.max(...la),mnLn=Math.min(...ln),mxLn=Math.max(...ln);
  const W=760,H=440,pad=38,sLa=(mxLa-mnLa)||.01,sLn=(mxLn-mnLn)||.01;
  const X=p=>pad+((p.lng-mnLn)/sLn)*(W-pad*2), Y=p=>H-pad-((p.lat-mnLa)/sLa)*(H-pad*2);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Croquis de las rutas">`;
  rutas.forEach((sec,i)=>{
    if(!sec.length) return;
    const pts=[base,...sec].concat(finPt?[finPt]:[]).map(p=>X(p)+','+Y(p)).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="${COLORES[i]}" stroke-width="2.5" opacity=".85" stroke-linejoin="round"/>`;
  });
  rutas.forEach((sec,i)=>sec.forEach((p,j)=>{
    s+=`<circle cx="${X(p)}" cy="${Y(p)}" r="12" fill="${COLORES[i]}" stroke="var(--paper)" stroke-width="2"/>`
     + `<text x="${X(p)}" y="${Y(p)+4}" text-anchor="middle" font-size="12" font-weight="700" fill="#E9EBE2">${j+1}</text>`;
  }));
  s+=`<rect x="${X(base)-8}" y="${Y(base)-8}" width="16" height="16" fill="var(--ink)"/></svg>`;
  return `<div class="mapa">${s}</div>`;
}

function linksMaps(sec, base, finPt){
  const q = p => `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
  const salida = [];
  for(let i=0;i<sec.length;i+=9){
    const b = sec.slice(i,i+9);
    const desde = i===0 ? q(base) : q(sec[i-1]);
    const ultimo = (i+9>=sec.length && finPt) ? finPt : b[b.length-1];
    const medio = (i+9>=sec.length && finPt) ? b : b.slice(0,-1);
    const wp = medio.map(q).join('%7C');
    salida.push(`<a class="tramo" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${desde}&destination=${q(ultimo)}${wp?'&waypoints='+wp:''}&travelmode=driving">Tramo ${salida.length+1} en Maps</a>`);
  }
  return salida.join('');
}

/* ---------- control: dónde ubicó cada dirección ---------- */
const LOCALIDADES = ['yerba buena','tafi viejo','las talitas','banda del rio sali','alderetes',
  'delfin gallo','lules','famailla','monteros','concepcion','aguilares','simoca','trancas',
  'burruyacu','bella vista','san miguel de tucuman'];
function discrepancia(p){
  if(!p.resuelta) return null;
  const dicho = sinTildes(p.dir), res = sinTildes(p.resuelta);
  const loc = LOCALIDADES.find(l => dicho.includes(l));
  if(loc && !res.includes(loc)) return loc;
  return null;
}
function panelDirecciones(base, finPt){
  const todos = [base, ...paradas].concat(finPt && finPt !== base ? [finPt] : []);
  const raras = todos.filter(discrepancia);
  let h = `<details class="verif"${raras.length?' open':''}>
    <summary>Dónde ubicó cada dirección${raras.length?` — ${raras.length} para revisar`:''}</summary><ul>`;
  h += todos.map(p => {
    const d = discrepancia(p);
    return `<li${d?' class="mal"':''}>
      <b>${esc(p.nombre)}</b> — vos pusiste <i>${esc(p.dir)}</i><br>
      <span>lo ubicó en: ${esc(p.resuelta || 'sin dato')}</span>
      ${d?`<br><span class="rojo">Ojo: dijiste ${esc(d)} y lo puso en otro lado. Ponele la localidad al final o cambiá la altura.</span>`:''}
      <br><a href="https://www.google.com/maps/search/?api=1&query=${p.lat.toFixed(6)},${p.lng.toFixed(6)}" target="_blank" rel="noopener">ver el punto exacto</a>
    </li>`;
  }).join('');
  return h + `</ul></details>`;
}

function render(iOrigen, iFin, base, finPt){
  const evs = rutas.map(s=>evaluar(s,iOrigen,iFin));
  const usados = rutas.filter(s=>s.length).length;
  const totKm = evs.reduce((a,e)=>a+e.km,0);
  const ultimo = Math.max(...evs.filter((e,i)=>rutas[i].length).map(e=>e.fin));
  const conflictos = evs.flatMap((e,i)=>e.det.filter(d=>d.mal).map(d=>({...d,auto:i+1})));

  let h = panelDirecciones(base, finPt) + `<div class="resumen">
    <div><span>Paradas</span><strong>${paradas.length}</strong></div>
    <div><span>Kilómetros</span><strong>${totKm.toFixed(1)}</strong></div>
    <div><span>Autos usados</span><strong>${usados}</strong></div>
    <div><span>Último en terminar</span><strong>${hhmm(ultimo)}</strong></div>
    <div><span>Fuera de horario</span><strong style="color:${conflictos.length?'var(--alert)':'inherit'}">${conflictos.length}</strong></div>
  </div>`;

  h += `<div class="autos">` + rutas.map((s,i)=>
    `<button class="${i===activo?'on':''}" onclick="verAuto(${i})">Auto ${i+1} · ${s.length} paradas · ${evs[i].km.toFixed(0)} km</button>`).join('') + `</div>`;

  const e = evs[activo];
  if(!rutas[activo].length){
    h += `<p class="hint" style="margin-top:16px">Este auto no hace falta hoy.</p>`;
  } else {
    h += `<ol class="ruta" style="--vcol:${COLORES[activo]}">` + e.det.map((d,i)=>`
      <li><span class="marca">${i+1}</span><div class="fila">
        <div><div class="hora">${hhmm(d.lleg)}</div><div class="meta">${d.km.toFixed(1)} km</div></div>
        <div style="flex:1">
          <div class="cliente">${esc(d.p.nombre)}</div>
          <div class="dir">${esc(d.p.dir)}</div>
          <div class="meta">
            ${d.p.desde!=null||d.p.hasta!=null?`<span class="tag fija">abre ${d.p.desde!=null?hhmm(d.p.desde):'—'} · cierra ${d.p.hasta!=null?hhmm(d.p.hasta):'—'}</span>`:''}
            ${d.espera>1?`<span class="tag espera">llegás ${Math.round(d.espera)} min antes de que abra</span>`:''}
            ${d.pico?`<span class="tag">tramo con tránsito pesado</span>`:''}
            ${d.mal?`<span class="tag mal">no llegás a tiempo</span>`:''}
          </div>
        </div></div></li>`).join('') + `</ol>`;
    if(e.regreso) h += `<p class="hint">Termina ${hhmm(e.regreso)}.</p>`;
    h += `<div style="margin-top:14px">${linksMaps(rutas[activo], base, finPt)}</div>`;
    h += `<div class="actions"><button class="ghost small" onclick="copiar(${activo})">Copiar esta hoja</button></div>`;
  }

  if(conflictos.length){
    h += `<div class="afuera"><h3>No entran en su horario</h3><ul>` + conflictos.map(c=>
      `<li>Auto ${c.auto} — ${esc(c.p.nombre)}: llegás ${hhmm(c.lleg)} y cierra ${hhmm(c.p.hasta)}.</li>`).join('')
      + `</ul><p class="hint">Salí más temprano, sumá un auto o cambiales el día. El motor ya probó todas las combinaciones que tenía.</p></div>`;
  }
  h += mapa(base, finPt);
  h += `<p class="hint">${degradado ? 'Sin conexión a los servicios de mapas: distancias estimadas en línea recta.' : 'Distancias y tiempos de manejo reales por calle.'}</p>`;
  $('out').innerHTML = h;
  window._ctx = {iOrigen,iFin,base,finPt};
}
function verAuto(i){ activo=i; const c=window._ctx; render(c.iOrigen,c.iFin,c.base,c.finPt); }
function copiar(i){
  const c = window._ctx, e = evaluar(rutas[i], c.iOrigen, c.iFin);
  const txt = `AUTO ${i+1} — salida ${$('salida').value}\n\n` + e.det.map((d,k)=>
    `${k+1}. ${hhmm(d.lleg)} — ${d.p.nombre}\n   ${d.p.dir}`).join('\n');
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); $('estado').className=''; $('estado').textContent='Hoja copiada.'; }catch(err){}
  document.body.removeChild(ta);
}

/* ---------- base de escuelas: búsqueda en vivo ---------- */
let BASE = [], sel = -1, ultimos = [];
const sinTildes = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

(async function cargarBase(){
  try{
    const r = await fetch('base-escuelas.json');
    if(!r.ok) throw 0;
    BASE = await r.json();
    BASE.forEach(p => p.k = sinTildes(p.n+' '+p.d+' '+p.l));
    $('estadoBase').textContent = `${BASE.length} escuelas cargadas. Escribí dos letras y elegí de la lista.`;
  }catch(e){
    $('estadoBase').textContent = 'No encontré base-escuelas.json en esta carpeta: por ahora cargá nombre y dirección a mano.';
  }
})();

function buscar(q){
  const t = sinTildes(q.trim());
  if(t.length < 2) return [];
  const palabras = t.split(/\s+/);
  const res = [];
  for(const p of BASE){
    if(palabras.every(w => p.k.includes(w))){ res.push(p); if(res.length === 40) break; }
  }
  return res.sort((a,b) => sinTildes(a.n).indexOf(palabras[0]) - sinTildes(b.n).indexOf(palabras[0])).slice(0,8);
}

function pintarSug(lista){
  ultimos = lista; sel = -1;
  if(!lista.length){
    if(BASE.length && $('nom').value.trim().length >= 2){
      $('sug').innerHTML = `<div class="sug nada">No está en la base. Escribí la dirección a mano y agregala igual.</div>`;
      $('sug').classList.add('on');
    } else $('sug').classList.remove('on');
    return;
  }
  $('sug').innerHTML = lista.map((p,i)=>
    `<div class="sug" data-i="${i}"><b>${esc(p.n)}</b><span>${esc(p.d)} · ${esc(p.l)}</span></div>`).join('');
  $('sug').classList.add('on');
}
function elegir(i){
  const p = ultimos[i]; if(!p) return;
  $('nom').value = p.n;
  $('dir').value = p.d + ', ' + p.l;
  $('sug').classList.remove('on');
  $('desde').focus();
}
$('sug').addEventListener('mousedown', e => {
  const d = e.target.closest('.sug'); if(!d || d.classList.contains('nada')) return;
  e.preventDefault(); elegir(+d.dataset.i);
});
$('nom').addEventListener('input', () => pintarSug(buscar($('nom').value)));
$('nom').addEventListener('blur', () => setTimeout(()=>$('sug').classList.remove('on'), 120));
$('nom').addEventListener('keydown', e => {
  if(!$('sug').classList.contains('on') || !ultimos.length) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + ultimos.length) % ultimos.length;
    [...$('sug').children].forEach((c,i)=>c.classList.toggle('sel', i === sel));
  } else if(e.key === 'Enter' && sel >= 0){ e.preventDefault(); elegir(sel); }
  else if(e.key === 'Escape'){ $('sug').classList.remove('on'); }
});

/* ---------- flujo ---------- */
$('agregar').addEventListener('click', ()=>{
  const nombre=$('nom').value.trim(), dir=$('dir').value.trim();
  if(!nombre || !dir){ $('estado').className='err'; $('estado').textContent='Faltan el nombre o la dirección.'; return; }
  paradas.push({nombre,dir,desde:aMin($('desde').value),hasta:aMin($('hasta').value)});
  ['nom','dir','desde','hasta'].forEach(id=>$(id).value='');
  $('estado').className=''; $('estado').textContent=''; tabla();
});
$('limpiar').addEventListener('click', ()=>{ paradas=[]; tabla(); $('out').innerHTML=''; });
$('demo').addEventListener('click', ()=>{
  if(!$('taller').value) $('taller').value='San Lorenzo 1200, San Miguel de Tucumán';
  if(!$('casa').value) $('casa').value='Av. Aconquija 1800, Yerba Buena';
  paradas = [
    ['Jardín Semillitas','Av. Mate de Luna 1450, Yerba Buena','08:00','11:30'],
    ['Sala Amarilla','Muñecas 850, San Miguel de Tucumán','09:00','12:00'],
    ['Jardín Arcoíris','Lavalle 2300, San Miguel de Tucumán','08:00','11:00'],
    ['Jardín Los Pinos','Av. Perón 1200, Tafí Viejo','14:00','17:00'],
    ['Esc. N° 118','Mitre 220, Banda del Río Salí','08:30','12:00'],
    ['Jardín Nube','Rivadavia 780, Alderetes',null,null],
    ['Proveedor Maderas','Gral. Paz 2200, San Miguel de Tucumán','09:00','13:00'],
    ['Jardín Colibrí','Solano Vera 1500, Yerba Buena',null,null],
    ['Esc. Normal','Córdoba 1800, San Miguel de Tucumán','10:00','12:30'],
    ['Jardín Girasol','Av. Roca 3400, Las Talitas',null,null]
  ].map(([nombre,dir,d,h])=>({nombre,dir,desde:aMin(d),hasta:aMin(h)}));
  tabla(); $('estado').className=''; $('estado').textContent='Día de ejemplo cargado. Dale a "Armar la ruta".';
});

$('armar').addEventListener('click', async ()=>{
  $('aviso').style.display='none'; degradado=false;
  if(!paradas.length){ $('estado').className='err'; $('estado').textContent='Cargá a dónde vas hoy.'; return; }
  const dirTaller=$('taller').value.trim(), dirCasa=$('casa').value.trim();
  const necesita = new Set([$('origen').value, $('fin').value]);
  if(necesita.has('taller') && !dirTaller){ $('estado').className='err'; $('estado').textContent='Falta la dirección del taller.'; return; }
  if(necesita.has('casa') && !dirCasa){ $('estado').className='err'; $('estado').textContent='Falta tu domicilio.'; return; }

  $('armar').disabled=true; $('estado').className='';
  try{
    const fijos=[{nombre:'Taller',dir:dirTaller||dirCasa},{nombre:'Domicilio',dir:dirCasa||dirTaller}];
    const todos = fijos.concat(paradas);
    const fallidas=[];
    for(let k=0;k<todos.length;k++){
      $('estado').textContent = `Ubicando direcciones… ${k+1} de ${todos.length}`;
      let p=null;
      try{ p = await geo(todos[k].dir); }catch(e){ throw new Error('SIN_RED'); }
      if(!p) fallidas.push(todos[k].nombre); else Object.assign(todos[k], p);
    }
    if(fallidas.length) throw new Error('No encontré estas direcciones: '+fallidas.join(', ')+'. Agregales la altura o la localidad.');

    $('estado').textContent='Calculando tiempos de manejo…';
    const pts = todos.map(t=>({lat:t.lat,lng:t.lng}));
    try{ M = await matriz(pts); }
    catch(e){ M = matrizRecta(pts); degradado=true;
      $('aviso').style.display='block';
      $('aviso').textContent='No pude conectarme al servicio de rutas, así que estimé las distancias en línea recta. Los tiempos son orientativos. Abrí este archivo desde tu hosting y vuelve a funcionar.'; }

    todos.forEach((t,i)=>t.i=i);
    const iTaller=0, iCasa=1;
    const iOrigen = $('origen').value==='taller'?iTaller:iCasa;
    const fv=$('fin').value;
    const iFin = fv==='libre'?null:(fv==='taller'?iTaller:iCasa);
    paradas = todos.slice(2);

    $('estado').textContent='Armando la ruta…';
    await dormir(20);
    const base = todos[iOrigen], finPt = iFin!=null?todos[iFin]:null;
    rutas = repartir(iOrigen, iFin, base);
    activo = 0;
    render(iOrigen, iFin, base, finPt);
    $('estado').textContent = `Listo: ${paradas.length} paradas en ${rutas.filter(s=>s.length).length} auto(s).`;
    $('out').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){
    $('estado').className='err';
    $('estado').textContent = e.message==='SIN_RED'
      ? 'No pude conectarme al buscador de direcciones desde acá. Bajá el archivo y abrilo desde tu hosting.'
      : e.message;
  }
  $('armar').disabled=false;
});
tabla();
</script>
